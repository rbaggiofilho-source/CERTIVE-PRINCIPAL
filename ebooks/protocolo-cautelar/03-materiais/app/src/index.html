<body>
<a class="skip" href="#main">Pular para o conteúdo</a>

<header class="topbar no-print">
  <div class="brand">
    <svg class="brand-ico" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1B222B"/><path d="M18 34l9 9 19-21" stroke="#F2A900" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="brand-txt">
      <strong>Painel de Vistoria</strong>
      <span id="cur-label" class="cur-label">Nenhuma vistoria aberta</span>
    </div>
  </div>
  <div class="top-actions">
    <button class="icon-btn" data-action="theme" aria-label="Alternar tema claro/escuro" title="Tema claro/escuro">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
    </button>
    <button class="icon-btn" data-action="go" data-view="lista" aria-label="Minhas vistorias" title="Minhas vistorias">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
    <button class="icon-btn" data-action="go" data-view="config" aria-label="Configuração do vistoriador" title="Configuração">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main id="main" tabindex="-1">
  <section id="view-config" class="view" hidden aria-labelledby="h-config"></section>
  <section id="view-lista" class="view" hidden aria-labelledby="h-lista"></section>
  <section id="view-vistoria" class="view" hidden aria-labelledby="h-vistoria"></section>
  <section id="view-roteiro" class="view" hidden aria-labelledby="h-roteiro"></section>
  <section id="view-pintura" class="view" hidden aria-labelledby="h-pintura"></section>
  <section id="view-resumo" class="view" hidden aria-labelledby="h-resumo"></section>
  <section id="view-laudo" class="view" hidden aria-labelledby="h-laudo"></section>
</main>

<nav class="tabbar no-print" aria-label="Etapas da vistoria">
  <button class="tab" data-action="go" data-view="vistoria">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13l2-5.5A2 2 0 0 1 6.9 6h10.2a2 2 0 0 1 1.9 1.5L21 13v5h-2.5M3 13v5h2.5M3 13h18M8.5 18h7"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/></svg>
    <span>Vistoria</span>
  </button>
  <button class="tab" data-action="go" data-view="roteiro">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>
    <span>Roteiro</span>
  </button>
  <button class="tab" data-action="go" data-view="pintura">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="4"/><path d="M7 9h10M7 15h10"/></svg>
    <span>Pintura</span>
  </button>
  <button class="tab" data-action="go" data-view="resumo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    <span>Resumo</span>
  </button>
  <button class="tab" data-action="go" data-view="laudo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2.5H6.5a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V8z"/><path d="M14 2.5V8h5.5M8.5 13h7M8.5 17h5"/></svg>
    <span>Laudo</span>
  </button>
</nav>

<div id="toast" class="toast no-print" role="status" aria-live="polite"></div>

<input type="file" id="file-camera" accept="image/*" capture="environment" hidden>
<input type="file" id="file-galeria" accept="image/*" multiple hidden>
<input type="file" id="file-logo" accept="image/*" hidden>
<input type="file" id="file-import" accept=".json,application/json" hidden>
