/* Painel de Vistoria — estilos (mobile-first). Tokens derivados de 02-design/tema.css */
:root {
  --carbono: #0F1318; --grafite: #1B222B; --aco: #2A3440;
  --ambar: #F2A900; --ambar-escuro: #B87F00; --ambar-claro: #FFF4D6;
  --n0: #2E9E5B; --n1: #4F7FB0; --n2: #E0A100; --n3: #E0661B; --n4: #C62828; --inc: #5A6472;
  --ok: #2E9E5B; --warn: #E0A100; --bad: #C62828;
  --f-titulo: "Archivo", "Arial Black", "Helvetica Neue", sans-serif;
  --f-texto: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: ui-monospace, "SFMono-Regular", Consolas, "Roboto Mono", monospace;
  --r: 12px; --r-sm: 8px;
  --tab-h: 64px; --top-h: 56px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
:root[data-theme="dark"] {
  --bg: #0F1318; --surface: #1B222B; --surface-2: #232C37; --surface-3: #2A3440;
  --border: #334050; --text: #ECEFF3; --text-2: #AEB8C4; --text-3: #8A96A3;
  --accent: #F2A900; --accent-ink: #0F1318; --accent-text: #F2A900; --focus: #FFD166;
  --danger-text: #FF8A80; --shadow: 0 1px 0 rgba(255,255,255,.03), 0 6px 18px rgba(0,0,0,.35);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #F2F3F5; --surface: #FFFFFF; --surface-2: #F5F6F8; --surface-3: #E7EAEE;
  --border: #D3D8DE; --text: #1A1F26; --text-2: #4E5864; --text-3: #66717D;
  --accent: #F2A900; --accent-ink: #0F1318; --accent-text: #845A00; --focus: #B87F00;
  --danger-text: #B3261E; --shadow: 0 1px 2px rgba(15,19,24,.06), 0 6px 18px rgba(15,19,24,.06);
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 16px/1.45 var(--f-texto);
  padding-top: calc(var(--top-h) + env(safe-area-inset-top, 0px));
  padding-bottom: calc(var(--tab-h) + var(--safe-b) + 16px);
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--f-titulo); font-weight: 800; letter-spacing: -.01em; line-height: 1.15; margin: 0 0 .5em; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1.02rem; }
p { margin: 0 0 .75em; }
a { color: var(--accent-text); }
small, .muted { color: var(--text-2); }
.mono { font-family: var(--f-mono); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.skip { position: absolute; left: -999px; top: 0; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; z-index: 100; }
.skip:focus { left: 8px; top: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- topo ---------- */
.topbar {
  position: fixed; inset: 0 0 auto 0; z-index: 20;
  height: calc(var(--top-h) + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) 8px 0 12px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: var(--carbono); color: #ECEFF3; border-bottom: 1px solid #222B36;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-ico { width: 32px; height: 32px; flex: none; }
.brand-txt { display: flex; flex-direction: column; min-width: 0; }
.brand-txt strong { font-family: var(--f-titulo); font-weight: 800; font-size: 1rem; letter-spacing: .01em; }
.cur-label { font-size: .78rem; color: #AEB8C4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cur-label b { color: var(--ambar); font-family: var(--f-mono); font-weight: 600; }
.top-actions { display: flex; gap: 2px; flex: none; }
.icon-btn {
  width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #ECEFF3;
  display: grid; place-items: center; cursor: pointer;
}
.icon-btn svg, .tab svg, .btn svg { flex: none; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:hover { background: #1B222B; }
.icon-btn[aria-current="page"] { color: var(--ambar); }

/* ---------- abas ---------- */
.tabbar {
  position: fixed; inset: auto 0 0 0; z-index: 20;
  height: calc(var(--tab-h) + var(--safe-b)); padding-bottom: var(--safe-b);
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--carbono); border-top: 1px solid #222B36;
}
.tab {
  border: 0; background: transparent; color: #AEB8C4; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font: 600 .72rem/1 var(--f-texto); min-height: 44px; position: relative;
}
.tab[aria-current="page"] { color: var(--ambar); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px; background: var(--ambar); }
.tab:disabled { opacity: .38; cursor: not-allowed; }
.tab .dot { position: absolute; top: 9px; right: calc(50% - 20px); width: 8px; height: 8px; border-radius: 50%; background: var(--n4); }

/* ---------- layout ---------- */
main { outline: none; }
.view { max-width: 760px; margin: 0 auto; padding: 16px 16px 8px; }
.view-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.view-head h1 { margin: 0; }
.view-head p { margin: 4px 0 0; color: var(--text-2); font-size: .9rem; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
  padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow);
}
.card h2 { font-size: 1.05rem; }
.card-note { background: var(--surface-2); border-left: 4px solid var(--accent); }
.card-warn { border-left: 4px solid var(--n3); }
.card-danger { border-left: 4px solid var(--n4); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.stack > * + * { margin-top: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (min-width: 640px) { .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; } }

/* ---------- formulários ---------- */
.field { display: block; margin-bottom: 12px; }
.field > span, .lbl { display: block; font-size: .82rem; font-weight: 600; color: var(--text-2); margin-bottom: 5px; }
.field .hint { display: block; font-size: .78rem; color: var(--text-3); margin-top: 4px; font-weight: 400; }
input[type=text], input[type=tel], input[type=email], input[type=number], input[type=datetime-local], input:not([type]), select, textarea {
  width: 100%; min-height: 48px; padding: 10px 12px; border-radius: var(--r-sm);
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  font: 400 16px/1.3 var(--f-texto);
}
textarea { min-height: 88px; resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 0; }
input.upper { text-transform: uppercase; font-family: var(--f-mono); letter-spacing: .04em; }
input::placeholder, textarea::placeholder { color: var(--text-3); }
.check { display: flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }

/* ---------- botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 10px 16px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  font: 600 .95rem/1.1 var(--f-texto); text-decoration: none; text-align: center;
}
.btn:hover { border-color: var(--text-3); }

/* ---------- lista de vistorias ---------- */

.thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
.thumb { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--surface-3); }

s; diferencial e cardã.","foto":false},{"id":"UTL-07","item":"Modificações (suspensão, rodas, carroceria)","verificar":"Alteração de característica exige regularização e registro no documento.","foto":true}]}]}</script>
<script>
/* ---- db.js ---- */
/* Painel de Vistoria — persistência local.
 * IndexedDB (stores: config, vistorias, fotos). Fallback: localStorage; último recurso: memória.
 * Fotos são guardadas como data URL JPEG (facilita exportar/importar e imprimir). */
const DB = (() => {
  const NAME = 'painel-vistoria';
  const VERSION = 1;
  const STORES = ['config', 'vistorias', 'fotos'];
  let idb = null;
  let mode = 'memoria';
  const mem = { config: new Map(), vistorias: new Map(), fotos: new Map() };

  function openIDB() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window) || !window.indexedDB) return reject(new Error('sem indexedDB'));
      let req;
      try { req = indexedDB.open(NAME, VERSION); } catch (e) { return reject(e); }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('config')) db.createObjectStore('config', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('vistorias')) db.createObjectStore('vistorias', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('fotos')) {
          const s = db.createObjectStore('fotos', { keyPath: 'id' });
          s.createIndex('vistoriaId', 'vistoriaId', { unique: false });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error('indexedDB bloqueado'));
    });
  }

  function lsOk() {
    try { const k = '__pv_test'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch (e) { return false; }
  }

  async function init() {
    try {
      idb = await Promise.race([openIDB(), new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 4000))]);
      mode = 'indexeddb';
    } catch (e) {
      idb = null;
      mode = lsOk() ? 'localstorage' : 'memoria';
    }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* opcional */ }
    return mode;
  }

  function tx(store, rw) { return idb.transaction(store, rw ? 'readwrite' : 'readonly').objectStore(store); }
  function p(req) { return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); }
  const lsKey = (store, id) => `pv:${store}:${id}`;

  async function get(store, id) {
    if (mode === 'indexeddb') return (await p(tx(store).get(id))) || null;
    if (mode === 'localstorage') { const s = localStorage.getItem(lsKey(store, id)); return s ? JSON.parse(s) : null; }
    const v = mem[store].get(id); return v ? JSON.parse(JSON.stringify(v)) : null;
  }
  async function put(store, obj) {
    if (mode === 'indexeddb') return p(tx(store, true).put(obj));
    if (mode === 'localstorage') {
      try { localStorage.setItem(lsKey(store, obj.id), JSON.stringify(obj)); }
      catch (e) { throw new Error('Espaço do navegador esgotado. Exporte e exclua vistorias antigas.'); }
      return obj.id;
    }
    mem[store].set(obj.id, JSON.parse(JSON.stringify(obj))); return obj.id;
  }
  async function del(store, id) {
    if (mode === 'indexeddb') return p(tx(store, true).delete(id));
    if (mode === 'localstorage') { localStorage.removeItem(lsKey(store, id)); return; }
    mem[store].delete(id);
  }
  async function all(store) {
    if (mode === 'indexeddb') return p(tx(store).getAll());
    if (mode === 'localstorage') {
      const out = []; const pre = `pv:${store}:`;
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(pre)) { try { out.push(JSON.parse(localStorage.getItem(k))); } catch (e) { /* ignora */ } }
      }
      return out;
    }
    return [...mem[store].values()].map(v => JSON.parse(JSON.stringify(v)));
  }
  async function fotosDa(vistoriaId) {
    if (mode === 'indexeddb') return p(tx('fotos').index('vistoriaId').getAll(vistoriaId));
    return (await all('fotos')).filter(f => f.vistoriaId === vistoriaId);
  }
  async function delFotosDa(vistoriaId) {
    const fs = await fotosDa(vistoriaId);
    for (const f of fs) await del('fotos', f.id);
  }
  async function estimate() {
    try { if (navigator.storage && navigator.storage.estimate) return await navigator.storage.estimate(); } catch (e) { /* */ }
    return null;
  }
  return { init, get, put, del, all, fotosDa, delFotosDa, estimate, get mode() { return mode; }, STORES };
})();

/* ---- logica.js ---- */
/* Painel de Vistoria — regras (roteiro, classificação, pintura). Sem acesso a DOM. */
const DADOS = JSON.parse(document.getElementById('dados-sistemas').textContent);

const NIVEIS = DADOS.niveis.map(n => n.id);                  // N0..N4
const NIVEL_NOME = Object.fromEntries(DADOS.niveis.map(n => [n.id, n.nome]));
NIVEL_NOME.NA = 'Não se aplica';
NIVEL_NOME.NV = 'Não verificável';
const NIVEL_DEF = Object.fromEntries(DADOS.niveis.map(n => [n.id, n.definicao]));
const COR = { N0: '#2E9E5B', N1: '#4F7FB0', N2: '#E0A100', N3: '#E0661B', N4: '#C62828', NA: '#7A8591', NV: '#5A6472' };

const TIPOS = {
  carro: 'Carro',
  moto: 'Moto',
  utl: 'Utilitário / picape'
};

/* Itens de outros sistemas que também se aplicam a motocicletas */
const MOTO_EXTRAS = ['ELE-03', 'INT-03', 'INT-07'];
/* Itens do IDV que não se aplicam a motocicletas */
const MOTO_SEM = ['IDV-04'];

const ITEM_INDEX = {};
for (const s of [...DADOS.sistemas, ...DADOS.anexos]) for (const it of s.itens) ITEM_INDEX[it.id] = { ...it, sistema: s.id };

/** Roteiro (lista de grupos) conforme o tipo de veículo. */
function roteiro(tipo) {
  const S = Object.fromEntries(DADOS.sistemas.map(s => [s.id, s]));
  const A = Object.fromEntries(DADOS.anexos.map(s => [s.id, s]));
  const g = s => ({ id: s.id, n: s.n, nome: s.nome, objetivo: s.objetivo, itens: s.itens });
  if (tipo === 'moto') {
    return [
      g(S.DOC),
      { ...g(S.IDV), itens: S.IDV.itens.filter(i => !MOTO_SEM.includes(i.id)) },
      { ...g(A.MOTO), n: 'M' },
      { id: 'CMP', n: '+', nome: 'Itens complementares', objetivo: 'Itens dos demais sistemas que também se aplicam a motocicletas.', itens: MOTO_EXTRAS.map(id => ITEM_INDEX[id]) }
    ];
  }
  const base = DADOS.sistemas.map(g);
  if (tipo === 'utl') base.push({ ...g(A.UTL), n: 'U' });
  return base;
}
function itensDo(tipo) { return roteiro(tipo).flatMap(s => s.itens.map(i => ({ ...i, grupo: s.id }))); }

/** Itens em que "Não verificável" é permitido: críticos de identificação (IDV) e o nº do quadro/motor da moto. */
function permiteNV(item) { return !!item.critico && (item.id.startsWith('IDV-') || item.id === 'MOTO-01'); }

function nivelDe(v, id) { const r = v.respostas && v.respostas[id]; return r && r.nivel ? r.nivel : null; }

function pendentes(v) { return itensDo(v.tipo).filter(i => !nivelDe(v, i.id)); }

function contagem(v) {
  const c = { N0: 0, N1: 0, N2: 0, N3: 0, N4: 0, NA: 0, NV: 0, pend: 0, total: 0 };
  for (const i of itensDo(v.tipo)) { c.total++; const n = nivelDe(v, i.id); if (n) c[n]++; else c.pend++; }
  return c;
}

/** Matriz de classificação: INCONCLUSIVO > REPROVADO > APROVADO COM APONTAMENTOS > APROVADO. */
function classificar(v) {
  const itens = itensDo(v.tipo);
  const com = nv => itens.filter(i => nivelDe(v, i.id) === nv);
  const nv = com('NV'), n4 = com('N4'), n3 = com('N3'), n2 = com('N2');
  if (nv.length) return { id: 'INCONCLUSIVO', css: 'INCONCLUSIVO', motivo: `Item(ns) de identificação não verificável(is): ${nv.map(i => i.id).join(', ')}. O laudo não conclui; o motivo está descrito no item.`, itens: nv };
  if (n4.length) return { id: 'REPROVADO', css: 'REPROVADO', motivo: `${n4.length} achado(s) crítico(s) N4: ${n4.map(i => i.id).join(', ')}.`, itens: n4 };
  if (n2.length || n3.length) {
    const partes = [];
    if (n3.length) partes.push(`${n3.length} apontamento(s) relevante(s) N3 — atenção`);
    if (n2.length) partes.push(`${n2.length} apontamento(s) N2`);
    return { id: 'APROVADO COM APONTAMENTOS', css: 'APONT', motivo: partes.join('; ') + '.', itens: [...n3, ...n2], atencao: n3.length > 0 };
  }
  return { id: 'APROVADO', css: 'APROVADO', motivo: 'Somente achados N0/N1 no exame técnico visual.', itens: [] };
}

/* ------------------------------ Mapa de pintura ------------------------------ */
const PECAS = [
  { id: 'parachoque_d', nome: 'Para-choque dianteiro', sig: 'PC-D', plastico: true, r: [38, 10, 124, 22, 10] },
  { id: 'capo', nome: 'Capô', sig: 'CAPÔ', r: [50, 36, 100, 84, 8] },
  { id: 'paralama_de', nome: 'Paralama dianteiro esquerdo', sig: 'PE', r: [20, 36, 26, 84, 8] },
  { id: 'paralama_dd', nome: 'Paralama dianteiro direito', sig: 'PD', r: [154, 36, 26, 84, 8] },
  { id: 'porta_de', nome: 'Porta dianteira esquerda (DE)', sig: 'DE', r: [20, 124, 18, 84, 4] },
  { id: 'porta_dd', nome: 'Porta dianteira direita (DD)', sig: 'DD', r: [162, 124, 18, 84, 4] },
  { id: 'porta_te', nome: 'Porta traseira esquerda (TE)', sig: 'TE', r: [20, 212, 18, 82, 4] },
  { id: 'porta_td', nome: 'Porta traseira direita (TD)', sig: 'TD', r: [162, 212, 18, 82, 4] },
  { id: 'coluna_e', nome: 'Colunas lado esquerdo (A/B/C)', sig: '', r: [41, 124, 9, 170, 3] },
  { id: 'coluna_d', nome: 'Colunas lado direito (A/B/C)', sig: '', r: [150, 124, 9, 170, 3] },
  { id: 'teto', nome: 'Teto', sig: 'TETO', r: [54, 150, 92, 116, 6] },
  { id: 'lateral_te', nome: 'Lateral traseira esquerda', sig: 'LE', r: [20, 298, 26, 78, 8] },
  { id: 'lateral_td', nome: 'Lateral traseira direita', sig: 'LD', r: [154, 298, 26, 78, 8] },
  { id: 'tampa', nome: 'Tampa traseira / porta-malas', sig: 'TAMPA', r: [50, 298, 100, 78, 8] },
  { id: 'parachoque_t', nome: 'Para-choque traseiro', sig: 'PC-T', plastico: true, r: [38, 380, 124, 24, 10] }
];
const SEMAFORO = {
  azul: { cor: '#4F7FB0', txt: 'Mais fina que as demais: investigar (polimento intenso ou peça substituída)', curto: 'Mais fina: investigar' },
  verde: { cor: '#2E9E5B', txt: 'Compatível' },
  amarelo: { cor: '#E0A100', txt: 'Provável repintura' },
  vermelho: { cor: '#C62828', txt: 'Provável repintura com massa/reparo' },
  vazio: { cor: null, txt: 'Sem leitura' },
  plastico: { cor: null, txt: 'Plástico — não medir' }
};

function leiturasValidas(arr) { return (arr || []).map(Number).filter(x => Number.isFinite(x) && x > 0); }
function mediaPeca(arr) { const l = leiturasValidas(arr); return l.length ? l.reduce((a, b) => a + b, 0) / l.length : null; }
function mediana(xs) { if (!xs.length) return null; const s = [...xs].sort((a, b) => a - b); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }

/** Calcula médias, referência (mediana das médias ou valor manual) e semáforo por peça. */
function calcPintura(pintura) {
  const pz = (pintura && pintura.pecas) || {};
  const medias = {};
  for (const p of PECAS) if (!p.plastico) { const m = mediaPeca(pz[p.id]); if (m != null) medias[p.id] = m; }
  const refAuto = mediana(Object.values(medias));
  const manual = Number(pintura && pintura.ref);
  const ref = Number.isFinite(manual) && manual > 0 ? manual : refAuto;
  const status = {};
  for (const p of PECAS) {
    if (p.plastico) { status[p.id] = 'plastico'; continue; }
    const m = medias[p.id];
    if (m == null || !ref) status[p.id] = 'vazio';
    else if (m < ref * 0.7) status[p.id] = 'azul';
    else if (m <= ref * 1.3) status[p.id] = 'verde';
    else if (m <= ref * 2) status[p.id] = 'amarelo';
    else status[p.id] = 'vermelho';
  }
  return { medias, refAuto, ref, manual: Number.isFinite(manual) && manual > 0, status, nMedidas: Object.keys(medias).length };
}

/** SVG do carro (vista superior, frente para cima). tema: 'app' | 'papel'. */
function svgCarro(pintura, opts = {}) {
  const tema = opts.tema || 'app';
  const pre = opts.prefixo || 'c';
  const calc = calcPintura(pintura);
  const vazio = tema === 'papel' ? '#E3E7EC' : '#3A4655';
  const vazioTxt = tema === 'papel' ? '#4E5864' : '#D6DCE3';
  const vidro = tema === 'papel' ? '#C9D3DE' : '#26303B';
  const corpo = tema === 'papel' ? '#F5F6F8' : '#161C23';
  const traco = tema === 'papel' ? '#FFFFFF' : '#0F1318';
  let s = `<svg viewBox="0 0 200 414" role="img" aria-label="Mapa de pintura, vista superior do veículo, frente para cima">`;
  s += `<defs><pattern id="${pre}-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${vazio}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${tema === 'papel' ? '#AEB8C4' : '#56657A'}" stroke-width="2.5"/></pattern></defs>`;
  s += `<rect x="16" y="6" width="168" height="402" rx="34" fill="${corpo}"/>`;
  s += `<rect x="52" y="124" width="96" height="22" rx="4" fill="${vidro}"/><rect x="52" y="270" width="96" height="24" rx="4" fill="${vidro}"/>`;
  for (const p of PECAS) {
    const st = calc.status[p.id];
    const fill = st === 'plastico' ? `url(#${pre}-hatch)` : (SEMAFORO[st].cor || vazio);
    const [x, y, w, h, rx] = p.r;
    const sel = opts.sel === p.id ? ' sel' : '';
    const m = calc.medias[p.id];
    const tit = `${p.nome}: ${SEMAFORO[st].txt}${m != null ? ' — média ' + Math.round(m) + ' µm' : ''}`;
    s += `<rect class="pc${sel}" data-peca="${p.id}" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${traco}" stroke-width="2"><title>${tit}</title></rect>`;
    if (p.sig) {
      const tc = (st === 'vazio' || st === 'plastico') ? vazioTxt : (st === 'amarelo' ? '#1A1F26' : '#FFFFFF');
      const big = w > 60;
      s += `<text x="${x + w / 2}" y="${y + h / 2 + 3}" style="fill:${tc};font-size:${big ? 10 : 8}px">${p.sig}</text>`;
      if (big && m != null) s += `<text x="${x + w / 2}" y="${y + h / 2 + 15}" style="fill:${tc};font-size:8px;font-weight:600">${Math.round(m)} µm</text>`;
    }
  }
  s += `</svg>`;
  return s;
}

/* ---- laudo.js ---- */
/* Painel de Vistoria — montagem do laudo (HTML para impressão A4).
 * O laudo é do vistoriador: nenhuma marca do produto aparece, salvo o rodapé opcional (desligado por padrão). */
const LAUDO_RODAPE_PRODUTO = 'Roteiro de vistoria: Protocolo Cautelar';

function fmtDataHora(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
function fmtKm(km) {
  const n = Number(String(km || '').replace(/\D/g, ''));
  return km ? n.toLocaleString('pt-BR') + ' km' : '—';
}
function val(x) { return x ? esc(x) : '—'; }

function laudoHTML(v, cfg, fotos, opts = {}) {
  const listarTodos = !!opts.listarTodos;
  const comFotos = opts.fotos !== false;
  const cls = classificar(v);
  const c = contagem(v);
  const ve = v.veiculo || {};
  const grupos = roteiro(v.tipo);
  let h = `<article class="laudo" aria-label="Laudo de vistoria">`;

  /* Cabeçalho */
  h += `<header class="l-head"><div class="l-emp">`;
  if (cfg.logo) h += `<img src="${cfg.logo}" alt="Logo de ${esc(cfg.nome || 'vistoriador')}">`;
  h += `<div><strong>${val(cfg.nome)}</strong>`;
  if (cfg.doc) h += `<span>${esc(cfg.doc)}</span>`;
  if (cfg.contato) h += `<span>${esc(cfg.contato)}</span>`;
  h += `</div></div><div class="l-num"><div class="t">LAUDO DE VISTORIA CAUTELAR</div>`;
  h += `<div class="n">Nº ${esc(v.numero)}</div><div class="d">Vistoria: ${fmtDataHora(v.dataHora)}</div></div></header>`;

  /* Dados */
  h += `<h2 class="l-sec">Veículo e solicitação</h2><div class="l-grid">`;
  const cel = (k, x, cls2) => `<div${cls2 ? ` class="${cls2}"` : ''}><span class="k">${k}</span><span class="v">${x}</span></div>`;
  h += cel('Placa', `<span class="mono">${val((ve.placa || '').toUpperCase())}</span>`);
  h += cel('Tipo', esc(TIPOS[v.tipo] || v.tipo));
  h += cel('Marca / modelo', val(ve.marcaModelo), 'wide2');
  h += cel('Ano fab. / mod.', `${val(ve.anoFab)} / ${val(ve.anoMod)}`);
  h += cel('Cor', val(ve.cor));
  h += cel('Hodômetro', ve.km ? fmtKm(ve.km) : '—');
  h += cel('Combustível', val(ve.combustivel));
  h += cel('Chassi (VIN)', `<span class="mono">${val((ve.chassi || '').toUpperCase())}</span>`, 'wide2');
  h += cel('RENAVAM', `<span class="mono">${val(ve.renavam)}</span>`, 'wide2');
  h += cel('Solicitante', val(v.solicitante), 'wide2');
  h += cel('Local da vistoria', val(v.local), 'wide2');
  h += `</div>`;

  /* Resultado */
  h += `<section class="l-cls ${cls.css}"><div><div class="lab">Resultado do exame</div><div class="val">${cls.id}</div></div>`;
  h += `<div><div class="why">${esc(cls.motivo)}</div><div class="l-counts" style="margin-top:6px">`;
  for (const n of ['N0', 'N1', 'N2', 'N3', 'N4']) h += `<span>${n}: ${c[n]}</span>`;
  if (c.NV) h += `<span>Não verif.: ${c.NV}</span>`;
  h += `<span>N/A: ${c.NA}</span></div></div></section>`;
  h += `<p class="l-note">A classificação refere-se ao resultado do exame técnico visual no momento da vistoria; não aprova a compra, não garante o veículo e não substitui a vistoria oficial.</p>`;

  if (v.parecer && v.parecer.trim()) {
    h += `<h2 class="l-sec">Parecer do vistoriador</h2><div class="l-parecer">${esc(v.parecer.trim())}</div>`;
  }

  /* Achados por sistema */
  h += `<h2 class="l-sec">Achados por sistema</h2>`;
  h += `<table class="l-tab"><thead><tr><th style="width:62px">Item</th><th>Verificação / observação</th><th style="width:48px">Nível</th></tr></thead><tbody>`;
  for (const g of grupos) {
    const cont = { N0: 0, N1: 0, N2: 0, N3: 0, N4: 0, NA: 0, NV: 0 };
    for (const it of g.itens) { const n = nivelDe(v, it.id); if (n) cont[n]++; }
    const resumo = ['N0', 'N1', 'N2', 'N3', 'N4', 'NV', 'NA'].filter(k => cont[k]).map(k => `${k === 'NA' ? 'N/A' : k === 'NV' ? 'Não verif.' : k}: ${cont[k]}`).join(' · ');
    h += `<tr class="sys-row"><td colspan="3">${esc(g.id)} — ${esc(g.nome)}<span class="sp">${resumo}</span></td></tr>`;
    let mostrados = 0;
    const na = [];
    for (const it of g.itens) {
      const r = (v.respostas || {})[it.id] || {};
      const n = r.nivel;
      if (n === 'NA') { na.push(it.id); if (!listarTodos) continue; }
      if (!listarTodos && n === 'N0' && !(r.obs && r.obs.trim())) continue;
      mostrados++;
      h += `<tr><td class="id">${esc(it.id)}</td><td>${esc(it.item)}${r.obs && r.obs.trim() ? `<span class="obs">${esc(r.obs.trim())}</span>` : ''}</td>`;
      h += `<td><span class="lchip ${n || ''}">${n ? (n === 'NA' ? 'N/A' : n === 'NV' ? 'N/V' : n) : '—'}</span></td></tr>`;
    }
    if (!listarTodos && !mostrados) {
      h += `<tr><td></td><td class="l-empty" colspan="2">${cont.N0 ? 'Itens verificados sem anormalidade observável (N0).' : 'Sem itens aplicáveis.'}${na.length ? ` Não se aplica: ${na.join(', ')}.` : ''}</td></tr>`;
    } else if (!listarTodos && na.length) {
      h += `<tr><td></td><td class="l-empty" colspan="2">Demais itens: N0.${na.length ? ` Não se aplica: ${na.join(', ')}.` : ''}</td></tr>`;
    }
  }
  h += `</tbody></table>`;
  h += `<p class="l-note"><b>Níveis:</b> N0 Conforme · N1 Observação · N2 Apontamento · N3 Apontamento relevante · N4 Crítico · N/V Não verificável · N/A Não se aplica.${listarTodos ? '' : ' Itens N0 sem observação não são listados individualmente.'}</p>`;

  /* Pintura */
  const temLeitura = v.tipo !== 'moto' && v.pintura && PECAS.some(p => leiturasValidas((v.pintura.pecas || {})[p.id]).length);
  if (temLeitura) {
    const pc = calcPintura(v.pintura);
    h += `<h2 class="l-sec">Mapa de espessura de pintura</h2><div class="l-pnt"><div>${svgCarro(v.pintura, { tema: 'papel', prefixo: 'l' })}</div><div>`;
    h += `<table class="l-tab"><thead><tr><th>Peça</th><th>Leituras <span class="nc">(µm)</span></th><th>Média</th><th>Indicação</th></tr></thead><tbody>`;
    for (const p of PECAS) {
      const l = leiturasValidas((v.pintura.pecas || {})[p.id]);
      if (p.plastico) { h += `<tr><td>${esc(p.nome)}</td><td colspan="3" class="l-empty">Plástico — não medido</td></tr>`; continue; }
      if (!l.length) { h += `<tr><td>${esc(p.nome)}</td><td colspan="3" class="l-empty">Sem leitura</td></tr>`; continue; }
      const st = pc.status[p.id];
      h += `<tr><td>${esc(p.nome)}</td><td class="leit">${l.join(', ')}</td><td class="mono">${Math.round(pc.medias[p.id])}</td><td><span class="lchip wrap" style="background:${SEMAFORO[st].cor};${st === 'amarelo' ? 'color:#1A1F26' : ''}">${SEMAFORO[st].txt}</span></td></tr>`;
    }
    h += `</tbody></table>`;
    h += `<p class="l-note">Referência: <b>${pc.ref ? Math.round(pc.ref) + ' µm' : '—'}</b> (${pc.manual ? 'definida pelo vistoriador' : 'mediana das médias das peças medidas'}). Critério: abaixo de 0,7× a referência = mais fina que as demais, investigar (polimento intenso ou peça substituída); de 0,7× a 1,3× = compatível; até 2× = provável repintura; acima de 2× = provável repintura com massa/reparo. Valores orientativos: a espessura de fábrica varia por fabricante, modelo, cor e processo; a indicação não substitui a inspeção visual da peça.</p>`;
    h += `</div></div>`;
  }

  /* Fotos */
  if (comFotos && fotos && fotos.length) {
    const ordem = itensDo(v.tipo).map(i => i.id);
    const fs = [...fotos].sort((a, b) => (ordem.indexOf(a.itemId) - ordem.indexOf(b.itemId)) || String(a.criadoEm).localeCompare(String(b.criadoEm)));
    h += `<h2 class="l-sec">Registro fotográfico (${fs.length})</h2><div class="l-fotos">`;
    fs.forEach((f, idx) => {
      const it = ITEM_INDEX[f.itemId] || { item: f.itemId };
      const n = nivelDe(v, f.itemId);
      h += `<figure><img src="${f.data}" alt="Foto ${idx + 1}: ${esc(it.item)}"><figcaption><b>${idx + 1}. ${esc(f.itemId)}</b> ${esc(it.item)}${n ? ` (${n === 'NA' ? 'N/A' : n})` : ''}</figcaption></figure>`;
    });
    h += `</div>`;
  }

  /* Limites */
  h += `<h2 class="l-sec">Limites do exame</h2><div class="l-lim">${esc(cfg.limites || '')}</div>`;

  /* Assinaturas */
  h += `<div class="l-sign"><div><b>${val(cfg.nome)}</b><small>${cfg.doc ? esc(cfg.doc) : 'Vistoriador responsável'}</small></div>`;
  h += `<div><b>${val(v.solicitante)}</b><small>Ciência do solicitante</small></div></div>`;

  h += `<footer class="l-foot"><span>Laudo nº ${esc(v.numero)} · emitido em ${fmtDataHora(v.emitidoEm || new Date().toISOString())}</span>`;
  h += `<span>${cfg.rodape ? LAUDO_RODAPE_PRODUTO : ''}</span></footer>`;
  h += `</article>`;
  return h;
}

};
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function uid(p) { return p + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }
function agoraLocal() { const d = new Date(); d.setSeconds(0, 0); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); }
function localParaISO(s) { const d = new Date(s); return isNaN(d) ? new Date().toISOString() : d.toISOString(); }
function isoParaLocal(iso) { const d = new Date(iso); if (isNaN(d)) return agoraLocal(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); }

let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400);
}

const VIEWS = ['config', 'lista', 'vistoria', 'roteiro', 'pintura', 'resumo', 'laudo'];
const PRECISA_VISTORIA = ['vistoria', 'roteiro', 'pintura', 'resumo', 'laudo'];
function go(view, opts = {}) {
  if (PRECISA_VISTORIA.includes(view) && !S.cur) view = 'lista';
  S.view = view;
  for (const v of VIEWS) $('#view-' + v).hidden = v !== view;
  $$('.tab').forEach(t => {
    const on = t.dataset.view === view;
    if (on) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
    t.disabled = !S.cur && t.dataset.view !== 'vistoria';
  });
  $$('.top-actions .icon-btn[data-view]').forEach(b => { if (b.dataset.view === view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  RENDER[view]();
  ajustarTextareas($('#view-' + view));
  atualizarTopo();
  if (!opts.keepScroll) window.scrollTo(0, 0);
}
function atualizarTopo() {
  const l = $('#cur-label');
  if (!S.cur) { l.textContent = 'Nenhuma vistoria aberta'; return; }
  const c = contagem(S.cur);
  const placa = (S.cur.veiculo.placa || '').toUpperCase() || 'sem placa';
  l.innerHTML = `<b>${esc(placa)}</b> · Nº ${esc(S.cur.numero)} · ${c.total - c.pend}/${c.total}`;
}

function vinHint(vin) {

/* ------------------------------ Fotos ------------------------------ */
function carregarImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Imagem inválida')); i.src = src; }); }
async function comprimir(file, max = 1280, q = 0.7, tipo = 'image/jpeg') {
  const url = URL.createObjectURL(file);
  try {
    const img = await carregarImg(url);
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * s)), h = Math.max(1, Math.round(img.naturalHeight * s));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    if (tipo === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
    ctx.drawImage(img, 0, 0, w, h);
    return cv.toDataURL(tipo, q);
  } finally { URL.revokeObjectURL(url); }
}
async function adicionarFotos(files) {
  const itemId = S.fotoItem; if (!itemId || !S.cur) return;
  let n = 0;
  for (const f of files) {
    if (!f.type.startsWith('image/')) continue;
    try {
      const data = await comprimir(f);
      const foto = { id: uid('f'), vistoriaId: S.cur.id, itemId, data, criadoEm: new Date().toISOString() };
      await DB.put('fotos', foto); S.fotos.push(foto); n++;
    } catch (e) { toast(e.message || 'Não foi possível ler a imagem'); }
  }
  if (n) { toast(`${n} foto(s) adicionada(s)`); salvarCur(); if (S.view === 'roteiro') refreshItem(itemId); }
}

  h += `<div class="count" style="--c:${COR.NV}"><b>${c.NV}</b><span>Não verif.</span></div><div class="count" style="--c:${COR.NA}"><b>${c.NA}</b><span>N/A</span></div><div class="count" style="--c:${c.pend ? '#E0661B' : COR.N0}"><b>${c.pend}</b><span>Pendentes</span></div>`;

  if (pend.length) {
    h += `<div class="card card-warn"><h2>Faltam ${pend.length} item(ns)</h2><p style="font-size:.88rem">O laudo só pode ser emitido com todos os itens respondidos (use N/A quando não se aplicar).</p><ul class="pend-list">`;

  }
  const achados = itensDo(v.tipo).filter(i => ['N4', 'NV', 'N3', 'N2'].includes(nivelDe(v, i.id)))
    .sort((a, b) => ['NV', 'N4', 'N3', 'N2'].indexOf(nivelDe(v, a.id)) - ['NV', 'N4', 'N3', 'N2'].indexOf(nivelDe(v, b.id)));

  if (v.tipo !== 'moto' && pc.nMedidas) {
    const alt = PECAS.filter(p => ['amarelo', 'vermelho', 'azul'].includes(pc.status[p.id]));
    h += `<div class="card"><h2>Pintura (orientativo)</h2><p style="font-size:.88rem;margin:0">${pc.nMedidas} peça(s) medida(s), referência ${Math.round(pc.ref)} µm. ${alt.length ? `Fora da faixa compatível: ${alt.map(p => `${esc(p.nome)} (${SEMAFORO[pc.status[p.id]].txt.toLowerCase()})`).join('; ')}. Confira se estão refletidas no sistema CAR.` : 'Todas as peças medidas entre 0,7× e 1,3× a referência.'}</p></div>`;
  }
  h += `<div class="card"><h2><label for="parecer">Parecer do vistoriador (opcional)</label></h2><textarea id="parecer" data-bind="parecer" rows="5" placeholder="Considerações finais, recomendações (ex.: orientar verificação oficial, revisão de freios)…">${esc(v.parecer || '')}</textarea></div>`;
  h += `<button class="btn btn-primary btn-block" data-action="go" data-view="laudo" ${pend.length ? 'aria-describedby="h-resumo"' : ''}>${pend.length ? 'Ver o que falta para o laudo' : 'Emitir laudo →'}</button>`;
  $('#view-resumo').innerHTML = h;
}

/* ------------------------------ Tela: laudo ------------------------------ */
function bloqueiosLaudo() {
  const b = [];
  const pend = pendentes(S.cur);
  if (pend.length) b.push(`${pend.length} item(ns) do roteiro sem resposta: ${pend.slice(0, 12).map(i => i.id).join(', ')}${pend.length > 12 ? '…' : ''}`);
  if (!S.cur.veiculo.placa && !S.cur.veiculo.chassi) b.push('Informe a placa ou o chassi do veículo.');
  if (!S.cfg.nome) b.push('Preencha o nome do vistoriador/empresa na configuração.');
  return b;
}
function renderLaudo() {
  const el = $('#view-laudo');
  const b = bloqueiosLaudo();
  if (b.length) {
    el.innerHTML = `<div class="view-head"><div><h1 id="h-laudo">Laudo</h1><p>Emissão bloqueada até completar a vistoria.</p></div></div>
    <div class="card card-danger" role="alert"><h2>Falta completar</h2><ul class="pend-list">${b.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="btn-row"><button class="btn btn-primary" data-action="go" data-view="resumo">Ver pendências no resumo</button>${!S.cfg.nome ? '<button class="btn" data-action="go" data-view="config">Configuração</button>' : ''}</div>`;
    return;
  }
  el.innerHTML = `<div class="view-head"><div><h1 id="h-laudo">Laudo nº ${esc(S.cur.numero)}</h1><p>Confira a prévia. Para gerar o PDF: Imprimir → “Salvar como PDF”.</p></div></div>
  <div class="card laudo-tools">
    <label class="check"><input type="checkbox" data-lopt="todos" ${S.laudoTodos ? 'checked' : ''}> <span>Listar todos os itens (inclusive N0)</span></label>
    <label class="check"><input type="checkbox" data-lopt="fotos" ${S.laudoFotos ? 'checked' : ''}> <span>Incluir fotos (${S.fotos.length})</span></label>
    <button class="btn btn-primary btn-block" data-action="imprimir" style="margin-top:6px"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M7 14h10v7H7z"/></svg>Imprimir / Salvar PDF</button>
    <p class="muted" style="font-size:.78rem;margin:8px 0 0">Android (Chrome): menu ⋮ → Compartilhar → Imprimir, ou o botão acima. iPhone: botão acima → nas opções de impressão, afaste dois dedos sobre a prévia e compartilhe/salve como PDF.</p>
  </div>
  <div class="paper-scroll"><div class="paper" id="paper">${laudoHTML(S.cur, S.cfg, S.fotos, { listarTodos: S.laudoTodos, fotos: S.laudoFotos })}</div></div>`;
}
async function imprimir() {
  S.cur.emitidoEm = new Date().toISOString();
  await salvarCur(true);
  $('#paper').innerHTML = laudoHTML(S.cur, S.cfg, S.fotos, { listarTodos: S.laudoTodos, fotos: S.laudoFotos });
  const t = document.title;
  document.title = `Laudo ${S.cur.numero} ${(S.cur.veiculo.placa || '').toUpperCase()}`.trim();
  const imgs = $$('#paper img');
  await Promise.all(imgs.map(i => i.complete ? null : new Promise(r => { i.onload = i.onerror = r; })));
  setTimeout(() => { window.print(); setTimeout(() => { document.title = t; }, 500); }, 60);
}

const RENDER = { config: renderConfig, lista: renderLista, vistoria: renderVistoria, roteiro: renderRoteiro, pintura: renderPintura, resumo: renderResumo, laudo: renderLaudo };

/* ------------------------------ Exportar / importar ------------------------------ */
function baixar(nome, texto) {
  const blob = new Blob([texto], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function exportar(id) {
  const v = await DB.get('vistorias', id); const fotos = await DB.fotosDa(id);
  const pkg = { formato: 'painel-vistoria', versao: 1, exportadoEm: new Date().toISOString(), vistorias: [v], fotos };
  baixar(`vistoria-${(v.veiculo.placa || 'sem-placa').toUpperCase()}-${v.numero}.json`, JSON.stringify(pkg));
  toast('Arquivo exportado');
}
async function backupTudo() {
  const vistorias = await DB.all('vistorias'); const fotos = await DB.all('fotos');
  const pkg = { formato: 'painel-vistoria', versao: 1, exportadoEm: new Date().toISOString(), config: S.cfg, vistorias, fotos };
  baixar(`backup-painel-vistoria-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(pkg));
  toast(`Backup: ${vistorias.length} vistoria(s), ${fotos.length} foto(s)`);
}
async function importarArquivo(file) {
  let pkg;
  try { pkg = JSON.parse(await file.text()); } catch (e) { toast('Arquivo inválido'); return; }
  if (!pkg || pkg.formato !== 'painel-vistoria' || !Array.isArray(pkg.vistorias)) { toast('Este arquivo não é uma exportação do Painel de Vistoria'); return; }
  let n = 0;
  for (const v of pkg.vistorias) {
    if (!v || !v.id || !v.respostas) continue;
    const existe = await DB.get('vistorias', v.id);
    if (existe && !confirm(`A vistoria ${v.numero} (${v.veiculo && v.veiculo.placa || 'sem placa'}) já existe neste aparelho. Substituir pela versão do arquivo?`)) continue;
    if (existe) await DB.delFotosDa(v.id);
    await DB.put('vistorias', v);
    for (const f of (pkg.fotos || []).filter(f => f.vistoriaId === v.id && typeof f.data === 'string' && f.data.startsWith('data:image/'))) await DB.put('fotos', f);
    n++;
  }
  if (pkg.config && confirm('O arquivo contém a configuração do vistoriador (nome, logo, textos). Substituir a configuração atual?')) {
    const seq = Math.max(S.cfg.seq || 0, pkg.config.seq || 0);
    S.cfg = { ...cfgPadrao(), ...pkg.config, id: 'cfg', seq }; await salvarCfg(); aplicarTema();
  }
  toast(`${n} vistoria(s) importada(s)`);
  if (S.cur) { const a = await DB.get('vistorias', S.cur.id); if (a) { S.cur = a; S.fotos = await DB.fotosDa(a.id); } }
  go('lista');
}

function autoAltura(t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 2, 360) + 'px'; }
function ajustarTextareas(root = document) { $$('textarea[data-obs], textarea#parecer', root).forEach(t => { if (t.value) autoAltura(t); }); }

/* ------------------------------ Tema ------------------------------ */
function aplicarTema() {
  const t = S.cfg && S.cfg.tema === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = '#0F1318';
}

/* ------------------------------ Eventos ------------------------------ */
function setPath(obj, path, value) { const ks = path.split('.'); let o = obj; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]] = o[ks[i]] || {}; o[ks[ks.length - 1]] = value; }

document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-action]');
  const pc = e.target.closest('.pnt-map [data-peca]');
  if (pc && !b) {
    S.selPeca = pc.dataset.peca;
    const card = $('#pc-' + S.selPeca);
    refreshPintura();
    if (card) { card.scrollIntoView({ behavior: 'smooth', block: 'center' }); const inp = card.querySelector('input'); if (inp) setTimeout(() => inp.focus({ preventScroll: true }), 350); }
    return;
  }
  if (!b) return;
  const a = b.dataset.action;
  switch (a) {
    case 'go': go(b.dataset.view); break;
    case 'theme': S.cfg.tema = S.cfg.tema === 'light' ? 'dark' : 'light'; aplicarTema(); salvarCfg(); if (S.view === 'config') renderConfig(); break;
    case 'nova': {
      S.cur = novaVistoriaObj(); S.fotos = []; S.sys = null; S.selPeca = null;
      S.cfg.ultimaVistoria = S.cur.id; await salvarCfg(); await salvarCur(true);
      go('vistoria'); toast(`Vistoria nº ${S.cur.numero} criada`);
      const pl = $('[data-bind="veiculo.placa"]'); if (pl) pl.focus();
      break;
    }
    case 'abrir': await abrirVistoria(b.dataset.id); break;
    case 'duplicar': {
      const o = await DB.get('vistorias', b.dataset.id); if (!o) break;
      const n = novaVistoriaObj();
      const copia = { ...JSON.parse(JSON.stringify(o)), id: n.id, numero: n.numero, criadoEm: n.criadoEm, atualizadoEm: n.atualizadoEm, dataHora: n.dataHora, emitidoEm: null };
      await salvarCfg(); await DB.put('vistorias', copia);
      toast(`Cópia criada: nº ${n.numero} (sem fotos)`); renderLista(); break;
    }
    case 'excluir': {
      const o = await DB.get('vistorias', b.dataset.id); if (!o) break;
      if (!confirm(`Excluir a vistoria nº ${o.numero} (${(o.veiculo.placa || 'sem placa').toUpperCase()}) e todas as suas fotos? Esta ação não pode ser desfeita.`)) break;
      await DB.delFotosDa(o.id); await DB.del('vistorias', o.id);
      if (S.cur && S.cur.id === o.id) { S.cur = null; S.fotos = []; }
      toast('Vistoria excluída'); go('lista'); break;
    }
    case 'exportar': await exportar(b.dataset.id); break;
    case 'backup': await backupTudo(); break;
    case 'importar': $('#file-import').click(); break;
    case 'logo': $('#file-logo').click(); break;
    case 'logo-del': S.cfg.logo = null; await salvarCfg(); renderConfig(); break;
    case 'limites-padrao': if (confirm('Substituir o texto atual pelo texto padrão?')) { S.cfg.limites = LIMITES_PADRAO; await salvarCfg(); renderConfig(); } break;
    case 'cfg-ok':
      if (!S.cfg.nome.trim()) { toast('Informe ao menos o nome'); $('[data-cfg="nome"]').focus(); break; }
      S.primeiraVez = false; await salvarCfg(); go('lista'); break;
    case 'tipo': S.cur.tipo = b.dataset.tipo; S.sys = null; salvarCur(); renderVistoria(); break;
    case 'sys': S.sys = b.dataset.sys; renderRoteiro(); window.scrollTo(0, 0); break;
    case 'sys-nav': {
      const gs = roteiro(S.cur.tipo); const i = gs.findIndex(g => g.id === S.sys) + Number(b.dataset.d);
      if (gs[i]) { S.sys = gs[i].id; renderRoteiro(); window.scrollTo(0, 0); }
      break;
    }
    case 'nivel': {
      const id = b.dataset.item; const v = b.dataset.v;
      const r = S.cur.respostas[id] = S.cur.respostas[id] || {};
      r.nivel = r.nivel === v ? null : v;
      if (!r.nivel) delete r.nivel;
      salvarCur(); refreshItem(id);
      const nb = $(`#it-${id} .lvb[data-v="${v}"]`); if (nb) nb.focus({ preventScroll: true });
      break;
    }
    case 'restante-n0': {
      const g = roteiro(S.cur.tipo).find(x => x.id === b.dataset.sys);
      const falt = g.itens.filter(i => !nivelDe(S.cur, i.id));
      if (!confirm(`Marcar ${falt.length} item(ns) restante(s) de ${g.id} como N0 (conforme)? Faça isso só se você realmente verificou cada um.`)) break;
      for (const i of falt) (S.cur.respostas[i.id] = S.cur.respostas[i.id] || {}).nivel = 'N0';
      salvarCur(); renderRoteiro(); break;
    }
    case 'obs': {
      const id = b.dataset.item; const r = S.cur.respostas[id] = S.cur.respostas[id] || {};
      r.showObs = !r.showObs || false; refreshItem(id);
      const t = $('#obs-' + id); if (t) t.focus();
      break;
    }
    case 'foto': S.fotoItem = b.dataset.item; $(b.dataset.src === 'camera' ? '#file-camera' : '#file-galeria').click(); break;
    case 'foto-del': {
      if (!confirm('Excluir esta foto?')) break;
      const f = S.fotos.find(x => x.id === b.dataset.foto); if (!f) break;
      await DB.del('fotos', f.id); S.fotos = S.fotos.filter(x => x.id !== f.id); refreshItem(f.itemId); break;
    }
    case 'ir-item': {
      const it = ITEM_INDEX[b.dataset.item];
      const g = roteiro(S.cur.tipo).find(x => x.itens.some(i => i.id === it.id));
      S.sys = g.id; go('roteiro');
      const el = $('#it-' + it.id); if (el) { el.scrollIntoView({ block: 'center' }); const f = el.querySelector('.lvb'); if (f) f.focus({ preventScroll: true }); }
      break;
    }
    case 'imprimir': await imprimir(); break;
  }
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.cfg) {
    const k = t.dataset.cfg;
    if (k === 'temaClaro') { S.cfg.tema = t.checked ? 'light' : 'dark'; aplicarTema(); }
    else S.cfg[k] = t.type === 'checkbox' ? t.checked : t.value;
    clearTimeout(t._t); t._t = setTimeout(salvarCfg, 300); return;
  }
  if (!S.cur) return;
  if (t.dataset.bind) {
    let val = t.value;
    if (t.dataset.bind === 'dataHora') val = localParaISO(val);
    if (t.dataset.bind === 'veiculo.placa' || t.dataset.bind === 'veiculo.chassi') { val = val.toUpperCase().replace(/[^A-Z0-9-]/g, ''); }
    if (t.dataset.bind === 'veiculo.chassi') { const hnt = $('#vin-hint'); if (hnt) hnt.textContent = vinHint(val); }
    setPath(S.cur, t.dataset.bind, val); salvarCur(); return;
  }
  if (t.tagName === 'TEXTAREA') autoAltura(t);
  if (t.dataset.obs) { const r = S.cur.respostas[t.dataset.obs] = S.cur.respostas[t.dataset.obs] || {}; r.obs = t.value; salvarCur(); return; }
  if (t.dataset.leit) {
    const [pid, i] = t.dataset.leit.split(':');
    const arr = S.cur.pintura.pecas[pid] = S.cur.pintura.pecas[pid] || ['', '', '', '', ''];
    arr[Number(i)] = t.value === '' ? '' : Number(t.value);
    S.selPeca = pid; salvarCur(); refreshPintura(); return;
  }
  if (t.hasAttribute('data-ref')) { S.cur.pintura.ref = t.value === '' ? '' : Number(t.value); salvarCur(); refreshPintura(); return; }
  if (t.dataset.lopt) {
    if (t.dataset.lopt === 'todos') S.laudoTodos = t.checked; else S.laudoFotos = t.checked;
    $('#paper').innerHTML = laudoHTML(S.cur, S.cfg, S.fotos, { listarTodos: S.laudoTodos, fotos: S.laudoFotos });
  }
});
document.addEventListener('change', (e) => { if (e.target.type === 'checkbox') e.target.dispatchEvent(new Event('input', { bubbles: true })); }, true);

$('#file-camera').addEventListener('change', async (e) => { const fs = [...e.target.files]; e.target.value = ''; await adicionarFotos(fs); });
$('#file-galeria').addEventListener('change', async (e) => { const fs = [...e.target.files]; e.target.value = ''; await adicionarFotos(fs); });
$('#file-import').addEventListener('change', async (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) await importarArquivo(f); });
$('#file-logo').addEventListener('change', async (e) => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const png = /png|svg|gif|webp/.test(f.type);
    S.cfg.logo = await comprimir(f, 480, 0.85, png ? 'image/png' : 'image/jpeg');
    await salvarCfg(); renderConfig(); toast('Logo atualizado');
  } catch (err) { toast('Não foi possível ler a imagem'); }
});
window.addEventListener('beforeprint', () => { if (S.view !== 'laudo' && S.cur && !bloqueiosLaudo().length) go('laudo'); });

/* ------------------------------ Início ------------------------------ */
(async function init() {
  await DB.init();
  S.cfg = { ...cfgPadrao(), ...((await DB.get('config', 'cfg')) || {}) };
  aplicarTema();
  if (!S.cfg.nome) { S.primeiraVez = true; go('config'); }
  else {
    if (S.cfg.ultimaVistoria) { const v = await DB.get('vistorias', S.cfg.ultimaVistoria); if (v) { S.cur = v; S.fotos = await DB.fotosDa(v.id); } }
    go(S.cur ? 'vistoria' : 'lista');
  }
  if (DB.mode === 'memoria') toast('Atenção: armazenamento indisponível — os dados serão perdidos ao fechar.');
  window.__painel = { S, DB, classificar, calcPintura, contagem, pendentes, go };
})();

</script>
