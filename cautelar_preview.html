<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cautelar Essencial · Prévia — Certive</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root {
      --navy: #143257; --navy-2: #0a1428; --gold: #d4a017;
      --bg: #f4f6f9; --card: #ffffff; --line: #e2e8f0;
      --ink: #1c2733; --muted: #6b7684;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg); color: var(--ink); }

    /* Cabeçalho */
    .ce-top { position: sticky; top: 0; z-index: 20;
      background: radial-gradient(circle at 30% 20%, var(--navy) 0%, var(--navy-2) 90%);
      color: #fff; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0)); }
    .ce-top__row { display: flex; align-items: center; gap: 10px; }
    .ce-brasao { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
      background: rgba(212,160,23,.12); border: 1px solid rgba(212,160,23,.45); border-radius: 9px; }
    .ce-brasao svg { width: 20px; height: 20px; fill: var(--gold); }
    .ce-top h1 { font-size: 16px; margin: 0; line-height: 1.1; }
    .ce-top small { color: #b9c7da; font-size: 11px; letter-spacing: .04em; }
    .ce-badge-nivel { margin-left: auto; background: var(--gold); color: #241a00;
      font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 20px; letter-spacing: .03em; }
    .ce-aviso-preview { margin: 8px 16px 0; font-size: 12px; color: #b9c7da; }

    .ce-wrap { max-width: 640px; margin: 0 auto; padding: 12px 12px 60px; }

    /* Painel semafórico */
    .ce-painel { position: sticky; top: 74px; z-index: 15; background: var(--card);
      border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 14px;
      box-shadow: 0 6px 18px rgba(20,50,87,.06); }
    .ce-painel__t { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .08em;
      text-transform: uppercase; margin-bottom: 8px; }
    .ce-semaforo { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .ce-sem { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .ce-sem__dot { width: 16px; height: 16px; border-radius: 50%; box-shadow: 0 0 0 3px rgba(0,0,0,.04); }
    .ce-sem__lbl { font-size: 9px; font-weight: 700; color: var(--muted); letter-spacing: .02em; text-align: center; }

    /* Blocos */
    .ce-bloco { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      margin-bottom: 14px; overflow: hidden; }
    .ce-bloco__h { display: flex; align-items: center; gap: 10px; padding: 12px 14px;
      font-size: 15px; font-weight: 700; color: var(--navy); border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fbfcfe, #f6f8fb); }
    .ce-bloco__n { width: 24px; height: 24px; border-radius: 7px; background: var(--navy); color: #fff;
      font-size: 12px; display: flex; align-items: center; justify-content: center; }
    .ce-bloco__b { padding: 12px 14px; }

    .ce-campo { display: block; margin-bottom: 12px; }
    .ce-campo__lbl { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
    .ce-in { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px;
      font-size: 15px; color: var(--ink); background: #fff; }
    .ce-in:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(20,50,87,.08); }
    textarea.ce-in { resize: vertical; }
    .ce-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
    .ce-grid2 .ce-campo { margin-bottom: 4px; }
    .ce-hint { font-size: 12px; color: var(--muted); margin: 0 0 10px; }

    .ce-grupo { font-size: 11px; font-weight: 800; color: var(--gold); letter-spacing: .08em;
      text-transform: uppercase; margin: 14px 0 6px; }
    .ce-grupo:first-child { margin-top: 0; }
    .ce-ponto { padding: 8px 0; border-bottom: 1px dashed var(--line); }
    .ce-ponto:last-child { border-bottom: 0; }
    .ce-ponto__nome { display: block; font-size: 13.5px; margin-bottom: 7px; }
    .ce-ponto--col { }

    /* Chips */
    .ce-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .ce-chip { border: 1px solid var(--line); background: #fff; color: var(--ink);
      font-size: 12.5px; padding: 7px 11px; border-radius: 20px; cursor: pointer; font-weight: 600; }
    .ce-chip:active { transform: scale(.97); }
    .ce-chip--on { background: var(--navy); color: #fff; border-color: var(--navy); }
    .ce-chip[disabled] { opacity: .45; cursor: not-allowed; }
    .ce-chip small { font-weight: 500; opacity: .85; }
    .ce-check { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px;
      color: var(--muted); margin-top: 8px; }
    .ce-check input { width: 17px; height: 17px; }

    /* Pintura */
    .ce-diagrama { display: flex; justify-content: center; padding: 6px 0 10px; }
    .ce-legenda { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11px; color: var(--muted);
      padding: 8px 0 12px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
    .ce-legenda span { display: inline-flex; align-items: center; gap: 5px; }
    .ce-legenda i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }

    /* Fotos */
    .ce-fotos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .ce-foto { border: 1.5px dashed var(--line); border-radius: 12px; min-height: 108px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      padding: 10px; text-align: center; position: relative; cursor: pointer; }
    .ce-foto--pend i { font-size: 26px; color: var(--navy); }
    .ce-foto--ok { border-style: solid; border-color: #1f9d55; cursor: default; padding: 0; overflow: hidden; }
    .ce-foto--ok img { width: 100%; height: 96px; object-fit: cover; }
    .ce-foto__lbl { font-size: 11px; color: var(--muted); line-height: 1.2; }
    .ce-foto--ok .ce-foto__lbl { padding: 6px 8px 2px; }
    .ce-foto__x { position: absolute; top: 6px; right: 6px; background: rgba(20,20,20,.7); color: #fff;
      border: 0; border-radius: 6px; font-size: 10px; padding: 3px 7px; cursor: pointer; }
    .ce-foto__gps { font-size: 9.5px; color: #1f9d55; padding: 0 8px 6px; }

    /* Avisos obrigatórios */
    .ce-avisos { margin-top: 14px; }
    .ce-aviso { font-size: 12.5px; line-height: 1.45; color: #7a3b00; background: #fff7e6;
      border: 1px solid #ffe2ab; border-radius: 10px; padding: 10px 12px; margin: 8px 0 0; }

    /* Rodapé */
    .ce-rodape { position: sticky; bottom: 0; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0)); }
    .ce-btn-laudo { width: 100%; border: 0; border-radius: 12px; padding: 15px; font-size: 15px; font-weight: 800;
      color: #241a00; background: var(--gold); cursor: pointer; letter-spacing: .02em; }
    .ce-btn-laudo:disabled { background: #d7dde4; color: #9aa4af; cursor: not-allowed; }
  </style>
</head>
<body>
  <header class="ce-top">
    <div class="ce-top__row">
      <span class="ce-brasao">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 6c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm-5 7.93c.02-1.95 3.34-2.93 5-2.93s4.98.98 5 2.93C15.5 17.5 13.9 18 12 18s-3.5-.5-5-3.07z"/>
        </svg>
      </span>
      <div>
        <h1>Laudo Cautelar</h1>
        <small>CERTIVE VISTORIAS</small>
      </div>
      <span class="ce-badge-nivel">ESSENCIAL</span>
    </div>
    <p class="ce-aviso-preview">Prévia do novo formulário — ambiente de teste. Nada é gravado no sistema.</p>
  </header>

  <main class="ce-wrap">
    <div id="ce-app"></div>
  </main>

  <script src="js/cautelar_essencial.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      CautelarEssencial.renderForm('ce-app', CautelarEssencial.estadoInicial());
    });
  </script>
</body>
</html>
